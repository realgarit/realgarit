<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Patrik Lleshaj, Platform Engineer in Central Switzerland">
  <title>Patrik Lleshaj, Platform Engineer in Central Switzerland</title>
  <style><![CDATA[
    @keyframes drift {
      0%, 100% { transform: translate(0px, 0px); }
      25% { transform: translate(4px, -3px); }
      50% { transform: translate(1px, 3px); }
      75% { transform: translate(-3px, -1px); }
    }
    @keyframes tw1 {
      0%, 100% { transform: translate(0px, 0px); opacity: 0.62; }
      50% { transform: translate(1.6px, -1.6px); opacity: 1; }
    }
    @keyframes tw2 {
      0%, 100% { transform: translate(0px, 0px); opacity: 0.6; }
      50% { transform: translate(-1.6px, 1.1px); opacity: 0.95; }
    }
    @keyframes tw3 {
      0%, 100% { transform: translate(0px, 0px); opacity: 0.78; }
      50% { transform: translate(1.1px, 1.6px); opacity: 1; }
    }
    .dot { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .constellation { animation: drift 20s ease-in-out infinite; }
      .d1 { animation: tw1 6s ease-in-out infinite; }
      .d2 { animation: tw2 7.2s ease-in-out infinite .5s; }
      .d3 { animation: tw3 8s ease-in-out infinite .2s; }
      .d4 { animation: tw1 6.8s ease-in-out infinite .9s; }
      .d5 { animation: tw2 5.6s ease-in-out infinite .3s; }
      .d6 { animation: tw3 7.6s ease-in-out infinite .7s; }
      .d7 { animation: tw1 6.4s ease-in-out infinite 1.1s; }
    }
  ]]></style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#1f9cc9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#glow)"/>
  <g class="constellation">
    <g stroke="#1f9cc9" stroke-opacity="0.32" stroke-width="1.4">
      <line x1="864" y1="86" x2="968" y2="62"/>
      <line x1="968" y1="62" x2="1072" y2="104"/>
      <line x1="1072" y1="104" x2="1016" y2="170"/>
      <line x1="1016" y1="170" x2="912" y2="196"/>
      <line x1="912" y1="196" x2="864" y2="86"/>
      <line x1="912" y1="196" x2="952" y2="128"/>
      <line x1="952" y1="128" x2="1072" y2="104"/>
      <line x1="1016" y1="170" x2="1112" y2="200"/>
    </g>
    <g fill="#1f9cc9">
      <circle class="dot d1" cx="864" cy="86" r="5"/>
      <circle class="dot d2" cx="968" cy="62" r="4"/>
      <circle class="dot d3" cx="1072" cy="104" r="6"/>
      <circle class="dot d4" cx="1016" cy="170" r="5"/>
      <circle class="dot d5" cx="912" cy="196" r="4"/>
      <circle class="dot d6" cx="952" cy="128" r="3.5"/>
      <circle class="dot d7" cx="1112" cy="200" r="4"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="278" rx="16" fill="none" stroke="#1f2328" stroke-opacity="0.10"/>
  <text x="72" y="130" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#1f2328">Patrik Lleshaj</text>
  <rect x="74" y="152" width="188" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="74" y="202" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#59636e">Platform Engineer&#8195;·&#8195;Central Switzerland</text>
</svg>
